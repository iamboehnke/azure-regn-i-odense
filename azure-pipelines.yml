trigger:
  branches:
    include: [main]

pr:
  branches:
    include: [main]

pool:
  vmImage: 'ubuntu-latest'

steps:
  - task: UsePythonVersion@0
    inputs:
      versionSpec: '3.11'

  - script: |
      pip install ruff
      ruff check .
    displayName: 'Lint Python-kode'

  - script: |
      python - <<'EOF'
      import json, glob, sys
      fejl = 0
      for f in glob.glob('**/*.json', recursive=True):
          try:
              json.load(open(f, encoding='utf-8'))
          except Exception as e:
              print(f'Ugyldig JSON i {f}: {e}')
              fejl += 1
      if fejl:
          sys.exit(1)
      print('Alle JSON-filer er gyldige')
      EOF
    displayName: 'Valider ADF JSON-filer'
